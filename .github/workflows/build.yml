name: Build unified feed

on:
  # ручной запуск из UI с выбором режима
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - rebuild
  # автозапуск по расписанию (каждые 3 часа)
  schedule:
    - cron: "0 */3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # кэш страниц (HTML), чтобы экономить запросы
      - name: Restore .cache/pages (HTML cache)
        uses: actions/cache@v6
        with:
          path: .cache/pages
          key: pages-${{ hashFiles('sources.json', 'scripts/aggregate.py') }}-${{ github.run_id }}
          restore-keys: |
            pages-${{ hashFiles('sources.json', 'scripts/aggregate.py') }}-
            pages-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build feed
        run: |
          mkdir -p .cache/candidates
          MODE="${{ github.event.inputs.mode }}"
          if [ "${MODE}" = "rebuild" ]; then
            echo "Running in REBUILD mode"
            python scripts/aggregate.py --rebuild \
              --output .cache/candidates/unified.json \
              --source-health-output .cache/candidates/source-health.json \
              --state-output .cache/candidates/state.json
          else
            echo "Running in NORMAL mode"
            python scripts/aggregate.py \
              --output .cache/candidates/unified.json \
              --source-health-output .cache/candidates/source-health.json \
              --state-output .cache/candidates/state.json
          fi

      - name: Validate and publish candidate
        id: validation
        continue-on-error: true
        # Strict validation happens before publication. On failure metrics does
        # not replace either published file, preserving the last usable feed.
        run: |
          set -o pipefail
          {
            echo '## Feed and source health'
            echo '```text'
            python scripts/metrics.py .cache/candidates/unified.json \
              --sources sources.json \
              --source-health .cache/candidates/source-health.json \
              --strict-source-health \
              --promote-feed docs/unified.json \
              --promote-source-health docs/source-health.json \
              --candidate-state .cache/candidates/state.json \
              --promote-state .cache/state.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit output (feed, source health & state)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/unified.json docs/source-health.json .cache/state.json \
            .cache/source-health-state.json || true
          git commit -m "Update unified feed [skip ci]" || echo "No changes"
          git push

      - name: Report validation failure
        if: steps.validation.outcome == 'failure'
        run: |
          echo "Candidate failed strict source-health validation; prior feed was retained." >&2
          exit 1
