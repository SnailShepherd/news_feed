name: Build unified feed

on:
  # ручной запуск из UI с выбором режима
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - rebuild
  # Primary runs: 12:17 and 20:17 Moscow time (UTC+3).
  # GitHub can occasionally delay or drop scheduled events, so a run at :47
  # acts as a fallback and is skipped when the primary run published recently.
  schedule:
    - cron: "17 9,17 * * *"
    - cron: "47 9,17 * * *"

concurrency:
  group: unified-feed-build
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run-build: ${{ steps.freshness.outputs.run-build }}
    steps:
      - name: Check out current branch head
        uses: actions/checkout@v7
        with:
          # A fallback may have waited behind the primary run. For scheduled
          # events, resolve the default branch again now instead of checking
          # out the stale SHA captured when the event was queued.
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref }}

      - name: Check whether fallback run is needed
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os

          is_fallback = os.environ["EVENT_NAME"] == "schedule" and os.environ["EVENT_SCHEDULE"].startswith("47 ")
          run_build = True
          if is_fallback:
              try:
                  with open("docs/source-health.json", encoding="utf-8") as source:
                      generated_at = json.load(source)["generated_at"]
                  generated = dt.datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
                  age = dt.datetime.now(dt.timezone.utc) - generated.astimezone(dt.timezone.utc)
                  run_build = age >= dt.timedelta(hours=2)
                  print(f"Published feed age: {age}")
              except (OSError, KeyError, TypeError, ValueError) as error:
                  print(f"Could not establish feed freshness; running fallback: {error}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"run-build={str(run_build).lower()}", file=output)
          PY

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run-build == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out current branch head
        uses: actions/checkout@v7
        with:
          # Keep a scheduled build based on the same up-to-date branch that
          # the freshness gate inspected. Manual runs retain their chosen ref.
          ref: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref }}

      # кэш страниц (HTML), чтобы экономить запросы
      - name: Restore .cache/pages (HTML cache)
        uses: actions/cache@v6
        with:
          path: .cache/pages
          key: pages-${{ hashFiles('sources.json', 'scripts/aggregate.py') }}-${{ github.run_id }}
          restore-keys: |
            pages-${{ hashFiles('sources.json', 'scripts/aggregate.py') }}-
            pages-

      # Cookies, cooldowns and anti-bot retry timestamps are runner-specific.
      # Restore them through Actions cache, never through the Git repository.
      - name: Restore runner session state
        uses: actions/cache@v6
        with:
          path: .cache/session-state.json
          key: session-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            session-state-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build feed
        run: |
          mkdir -p .cache/candidates
          MODE="${{ github.event.inputs.mode }}"
          if [ "${MODE}" = "rebuild" ]; then
            echo "Running in REBUILD mode"
            python scripts/aggregate.py --rebuild \
              --output .cache/candidates/unified.json \
              --source-health-output .cache/candidates/source-health.json \
              --state-output .cache/candidates/state.json
          else
            echo "Running in NORMAL mode"
            python scripts/aggregate.py \
              --output .cache/candidates/unified.json \
              --source-health-output .cache/candidates/source-health.json \
              --state-output .cache/candidates/state.json
          fi

      - name: Validate and publish candidate
        id: validation
        continue-on-error: true
        # Candidate integrity validation happens before publication. Individual
        # source failures remain visible below, but are diagnostic only.
        run: |
          set -o pipefail
          {
            echo '## Feed and source health'
            echo '```text'
            python scripts/metrics.py .cache/candidates/unified.json \
              --sources sources.json \
              --source-health .cache/candidates/source-health.json \
              --promote-feed docs/unified.json \
              --promote-source-health docs/source-health.json \
              --candidate-state .cache/candidates/state.json \
              --promote-state .cache/state.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit output (feed, source health & state)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/unified.json docs/source-health.json .cache/state.json \
            .cache/source-health-state.json || true
          git commit -m "Update unified feed [skip ci]" || echo "No changes"
          git push

      - name: Upload GitHub Pages artifact
        if: steps.validation.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Report validation failure
        if: steps.validation.outcome == 'failure'
        run: |
          echo "Candidate failed feed validation; prior feed was retained." >&2
          exit 1

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
