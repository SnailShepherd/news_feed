name: Build unified feed

on:
  # ручной запуск из UI с выбором режима
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - rebuild
  # автозапуск по расписанию (каждые 3 часа)
  schedule:
    - cron: "0 */3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # кэш страниц (HTML), чтобы экономить запросы
      - name: Restore .cache/pages (HTML cache)
        uses: actions/cache@v6
        with:
          path: .cache/pages
          key: pages-${{ hashFiles('sources.json', 'scripts/aggregate.py') }}-${{ github.run_id }}
          restore-keys: |
            pages-${{ hashFiles('sources.json', 'scripts/aggregate.py') }}-
            pages-

      # Cookies, cooldowns and anti-bot retry timestamps are runner-specific.
      # Restore them through Actions cache, never through the Git repository.
      - name: Restore runner session state
        uses: actions/cache@v6
        with:
          path: .cache/session-state.json
          key: session-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            session-state-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build feed
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${MODE}" = "rebuild" ]; then
            echo "Running in REBUILD mode"
            python scripts/aggregate.py --rebuild
          else
            echo "Running in NORMAL mode"
            python scripts/aggregate.py
          fi

      - name: Check source health
        # A source can be absent from the globally capped feed even when its
        # crawl succeeded. Report crawl degradation, but do not discard a good
        # feed merely because an upstream site is temporarily unavailable.
        run: |
          set -o pipefail
          {
            echo '## Feed and source health'
            echo '```text'
            python scripts/metrics.py docs/unified.json \
              --sources sources.json \
              --source-health docs/source-health.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit output (feed, source health & durable state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/unified.json docs/source-health.json .cache/state.json || true
          git commit -m "Update unified feed [skip ci]" || echo "No changes"
          git push

      # Alert only after the usable feed and diagnostics have been published.
      # A source becomes a hard failure after three consecutive bad runs.
      - name: Enforce repeated source failures
        run: >-
          python scripts/metrics.py docs/unified.json
          --sources sources.json
          --source-health docs/source-health.json
          --strict-source-health
